<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>納品報告フォーム</title>
    <link rel="stylesheet" href="gemini.css">
</head>
<body>

<div class="container">
    <h2>納品報告</h2>
    
    <label for="date">納品日</label>
    <input type="date" id="date" required>

    <label>納品時刻</label>
    <div class="time-row">
        <div class="select-wrapper">
            <select id="hour" required></select>
        </div>
        <span class="separator">:</span>
        <div class="select-wrapper">
            <select id="minute" required></select>
        </div>
    </div>

    <div class="content-count-row">
        <div class="content-box">
            <label for="content">納品物の内容</label>
            <div class="select-wrapper">
                <select id="content">
                    <option value="シュリンク挿し" selected>シュリンク挿し</option>
                    <option value="組立（紐）">組立（紐）</option>
                    <option value="組立（チェーン）">組立（チェーン）</option>
                    <option value="解体">解体</option>
                    <option value="新規">新規</option>
                </select>
            </div>
        </div>
        <div class="count-box">
            <label for="count">個数</label>
            <div class="select-wrapper">
                <select id="count" required></select>
            </div>
        </div>
    </div>

    <div id="statusMessage" class="status"></div>
    <button id="submitBtn">Discordへ送信</button>
</div>

<script src="gemini.js"></script>
</body>
</html>
