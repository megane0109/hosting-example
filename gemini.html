<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>納品報告フォーム</title>
    <link rel="stylesheet" href="gemini.css">
</head>
<body>

<div class="container">
    <h2>納品報告</h2>
    
    <label for="date">納品日 (mm/dd)</label>
    <div class="select-wrapper">
        <select id="date" required></select>
    </div>

    <label for="time">納品時刻 (hh:mm)</label>
    <div class="select-wrapper">
        <select id="time" required></select>
    </div>

    <label for="content">納品物の内容</label>
    <input type="text" id="content" placeholder="例: バナー画像" required>

    <label for="count">納品物の個数</label>
    <input type="number" id="count" min="1" value="1" required>

    <div id="statusMessage" class="status"></div>
    <button id="submitBtn">Discordへ送信</button>
</div>

<script src="gemini.js"></script>
</body>
</html>
