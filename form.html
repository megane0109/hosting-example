<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <input type="date" name="calendar" max="9999-12-31">

    <select name="select_hour">
        <option>09</option>
        <option>10</option>
        <option>11</option>
        <option>12</option>
        <option>13</option>
        <option>14</option>
        <option>15</option>
        <option>16</option>
        <option>17</option>
        <option>18</option>        
    </select>

    <select name="select_minute">
        <option>00</option>
        <option>15</option>
        <option>30</option>
        <option>45</option>     
    </select>

    <select name="select_order">
        <option>00</option>
        <option>15</option>
        <option>30</option>
        <option>45</option>     
    </select>

    <select name="select_order">
        <option>シュリンク挿し</option>
        <option>紐付梱包</option>
        <option>チェーン付梱包</option>
        <option>解体</option>     
    </select>

    <select name="box">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10" selected>10</option>
    </select>

</body>
</html>
